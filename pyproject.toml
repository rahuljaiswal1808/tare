[project]
name = "tare"
version = "0.1.0"
description = "Tool And Response Economy: measure the context-window cost and design economy of MCP servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rahul Jaiswal" }]
dependencies = [
  "tiktoken>=0.7",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
live = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
tare = "tare.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tare"]
